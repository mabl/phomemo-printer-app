[workspace]
members = ["phomemo-protocol", "phomemo-pappl"]
resolver = "2"

[workspace.package]
# Minimum: `u8::cast_signed` (1.87; clippy::incompatible_msrv enforces this)
# and the locked zvariant_derive 5.10 (rust-version 1.87).
rust-version = "1.87"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"

# The staticlib carries all of std and every dependency until LTO prunes it.
# Clean x86_64 builds, stripped binary: no LTO 7.4 MB in 34 s; thin LTO
# 3.2 MB in 30 s; fat LTO 2.4 MB in 54 s, with one codegen unit 2.2 MB in
# 73 s. Thin LTO saves most of the size for no build time. Panics still
# unwind: discovery catches a panicking BlueZ query (bt/flight.rs).
[profile.release]
lto = "thin"
