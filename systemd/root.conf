# A drop-in that runs phomemo-printer-app.service as root, which remote web
# interface logins need: PAM's pam_unix checks other users' passwords only
# as root. To use it:
#
#   install -D -m 0644 root.conf \
#     /etc/systemd/system/phomemo-printer-app.service.d/root.conf
#   systemctl daemon-reload
#   systemctl restart phomemo-printer-app
#
# systemd then gives the state directory to root, and back to the dynamic
# user when the drop-in is removed. The unit's sandbox stays, but for root
# it limits accidents, not a compromised server: root may ask systemd for
# anything over D-Bus.

[Service]
DynamicUser=no

# Linux-PAM 1.6 and later check every shadowed password with unix_chkpwd,
# whose child first calls setuid(0), a no-op for root but in @privileged.
SystemCallFilter=setuid
# Where /etc/shadow is mode 0000, as Fedora and RHEL ship it, unix_chkpwd
# reads it only with this capability.
#CapabilityBoundingSet=CAP_DAC_READ_SEARCH

# libcups keeps root's TLS credentials in its compiled-in /etc/cups/ssl: give
# the server its own directory there, hiding CUPS' configuration and keys.
# The tmpfs needs /etc/cups on the host: without CUPS, systemd creates it,
# empty, and it stays; with a read-only /etc the service does not start.
StateDirectory=phomemo-printer-app/ssl
TemporaryFileSystem=/etc/cups:ro
BindPaths=%S/phomemo-printer-app/ssl:/etc/cups/ssl
