language = "C"
include_guard = "PHOMEMO_PAPPL_H"
autogen_warning = "/* This file is auto-generated by cbindgen. Do not edit. */"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h", "pappl/pappl.h"]
# Refer to structs by their typedef names, so PAPPL's types read as
# `pappl_job_t` rather than `struct pappl_job_t`.
style = "type"
usize_is_size_t = true

[export.rename]
# Opaque stand-ins for PAPPL types (`src/pappl.rs`), which pappl.h defines.
"PapplJob" = "pappl_job_t"
"PapplDevice" = "pappl_device_t"
"PapplPrOptions" = "pappl_pr_options_t"
"PapplDeviceCb" = "pappl_device_cb_t"
"PapplDeverrorCb" = "pappl_deverror_cb_t"
