name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Also opens /dev/kvm to the Nix build users (enable_kvm, the
      # default), which the NixOS VM test needs.
      - uses: cachix/install-nix-action@v31
      # Evaluates the flake for every system, and builds this one's checks:
      # the package with its Rust tests, formatting, clippy, the C sources
      # with -Werror - everything `make ci` runs, but hermetically - the
      # dev shell, and the NixOS module, evaluated and in a VM test.
      - name: nix flake check
        run: nix flake check --all-systems
