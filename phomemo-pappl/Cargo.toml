[package]
name = "phomemo-pappl"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "PAPPL FFI bridge + BT transport for Phomemo printer application"
license = "Apache-2.0"
repository = "https://github.com/phomemo-m220/phomemo_m220"
readme = "../README.md"
keywords = ["phomemo", "pappl", "printer", "bluetooth", "cups"]
categories = ["hardware-support", "api-bindings"]

[lib]
crate-type = ["staticlib"]

[dependencies]
phomemo-protocol = { path = "../phomemo-protocol", features = ["compress"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
png = "0.17"

[lints]
workspace = true
