<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Overprint design template: Phomemo M220, 40 x 30 mm gap labels, 2 mm bleed.

  Page: 44 x 34 mm, one user unit per millimetre. Print it as the page size
  44x34mm.Borderless (CUPS) or om_40x30mm-overprint-2mm_44x34mm (IPP), at
  100 %, never scaled to fit.

  The label is the rectangle x 2-42 mm, y 2-32 mm. Of the bleed around it:
    left   (x 0-2 mm)    printed
    right  (x 42-44 mm)  never printed: the head ends at the label's edge
    top    (y 0-2 mm)    not printed
    bottom (y 32-34 mm)  printed only with phomemo-overprint-vertical
                         set to trailing
  Let backgrounds run to the page's edges; keep text inside the label.

  Draw in the "Artwork" layer. The "Guides (hide before printing)" layer
  lies above it, is locked, and must be hidden before printing or
  exporting, or it prints.
  Inkscape also shows the label's edges as guides. For a PNG submitted
  directly to the printer application, export exactly 351 x 271 pixels
  (set the size in pixels; 203 dpi in Inkscape gives 352 x 272, which
  PAPPL rescales).

  See docs/overprint.md.
-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   width="44mm"
   height="34mm"
   viewBox="0 0 44 34"
   version="1.1"
   id="m220-40x30-overprint-2mm">
  <title>M220 40 x 30 mm + 2 mm overprint design</title>
  <sodipodi:namedview
     id="namedview"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1"
     showguides="true"
     inkscape:document-units="mm">
    <!-- Positions in user units (mm); a horizontal guide's position is
         stored from the bottom, which for y 2 and 32 is the same pair. -->
    <sodipodi:guide
       id="guide-label-left"
       position="2,34"
       orientation="1,0"
       inkscape:label="label left edge (x 2 mm)"
       inkscape:locked="true" />
    <sodipodi:guide
       id="guide-label-right"
       position="42,34"
       orientation="1,0"
       inkscape:label="label right edge (x 42 mm)"
       inkscape:locked="true" />
    <sodipodi:guide
       id="guide-label-y2"
       position="0,32"
       orientation="0,1"
       inkscape:label="label edge (y 2 mm)"
       inkscape:locked="true" />
    <sodipodi:guide
       id="guide-label-y32"
       position="0,2"
       orientation="0,1"
       inkscape:label="label edge (y 32 mm)"
       inkscape:locked="true" />
  </sodipodi:namedview>
  <defs
     id="defs">
    <pattern
       id="hatch-not-printed"
       patternUnits="userSpaceOnUse"
       width="0.8"
       height="0.8"
       patternTransform="rotate(45)">
      <rect
         id="hatch-background"
         x="0"
         y="0"
         width="0.8"
         height="0.8"
         fill="#fde8e8" />
      <line
         id="hatch-line"
         x1="0.2"
         y1="0"
         x2="0.2"
         y2="0.8"
         stroke="#f0b4b4"
         stroke-width="0.15" />
    </pattern>
  </defs>
  <g
     inkscape:groupmode="layer"
     inkscape:label="Artwork"
     id="layer-artwork"
     style="display:inline" />
  <g
     inkscape:groupmode="layer"
     inkscape:label="Guides (hide before printing)"
     id="layer-guides"
     sodipodi:insensitive="true"
     style="display:inline">
    <!-- Right bleed: never printed. -->
    <rect
       id="right-bleed"
       x="42"
       y="0"
       width="2"
       height="34"
       fill="url(#hatch-not-printed)" />
    <text
       id="right-bleed-note"
       x="43"
       y="17.35"
       transform="rotate(90 43 17)"
       text-anchor="middle"
       font-family="sans-serif"
       font-size="1"
       fill="#b00000">right 2 mm: never printed</text>
    <!-- Top bleed: not printed. -->
    <rect
       id="top-bleed"
       x="0"
       y="0"
       width="42"
       height="2"
       fill="#f0f0f0" />
    <text
       id="top-bleed-note"
       x="21"
       y="1.35"
       text-anchor="middle"
       font-family="sans-serif"
       font-size="1"
       fill="#808080">top bleed: not printed</text>
    <!-- Bottom bleed: printed only with the trailing policy. -->
    <rect
       id="bottom-bleed"
       x="0"
       y="32"
       width="42"
       height="2"
       fill="#fff4dc" />
    <text
       id="bottom-bleed-note"
       x="21"
       y="33.35"
       text-anchor="middle"
       font-family="sans-serif"
       font-size="1"
       fill="#a06000">bottom bleed: printed only with policy trailing</text>
    <!-- Left bleed: printed. -->
    <text
       id="left-bleed-note"
       x="1"
       y="17.35"
       transform="rotate(-90 1 17)"
       text-anchor="middle"
       font-family="sans-serif"
       font-size="1"
       fill="#006000">left bleed: printed</text>
    <!-- The label's edges, extended across the bleed. -->
    <path
       id="bleed-lines"
       d="M 0,2 H 44 M 0,32 H 44 M 2,0 V 34"
       fill="none"
       stroke="#808080"
       stroke-width="0.08"
       stroke-dasharray="0.6,0.4" />
    <!-- The label. -->
    <rect
       id="label"
       x="2"
       y="2"
       width="40"
       height="30"
       fill="none"
       stroke="#0060c0"
       stroke-width="0.15" />
    <text
       id="label-note"
       x="2.6"
       y="3.4"
       font-family="sans-serif"
       font-size="1"
       fill="#0060c0">label 40 x 30 mm</text>
  </g>
</svg>
