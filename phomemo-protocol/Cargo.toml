[package]
name = "phomemo-protocol"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Phomemo printer protocol encoder/decoder — pure Rust, no FFI"
license = "Apache-2.0"
repository = "https://github.com/mabl/phomemo-printer-app"
readme = "../README.md"
keywords = ["phomemo", "printer", "label", "protocol", "bluetooth"]
categories = ["encoding", "parser-implementations"]

[dependencies]
lzokay = { version = "2.0.1", optional = true, default-features = false, features = ["compress", "alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# The tests decompress what `compress` produced.
lzokay = { version = "2.0.1", default-features = false, features = ["decompress"] }

[lints]
workspace = true

[features]
default = []
compress = ["dep:lzokay"]
